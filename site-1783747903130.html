<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>—͟͞͞ 𝐅𝐋𝐀𝐗𝐘 𝐗 𝐏𝐑𝐄𝐃𝐈𝐂𝐓𝐎𝐑 • VIP CONTROL HUB</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&amp;family=Orbitron:wght@400;600;700;900&amp;display=swap" rel="stylesheet"/>
<style>
:root {
  --gold: #f0c040;
  --gold2: #d4a030;
  --gold3: #b88020;
  --red: #e03030;
  --red2: #ff4444;
  --red3: #c02020;
  --bg: #060608;
  --bg2: #0c0c10;
  --bg3: #12121a;
  --bg4: #1a1a24;
  --glass: rgba(255,255,255,0.04);
  --glass2: rgba(255,255,255,0.07);
  --border: rgba(240,192,64,0.2);
  --border2: rgba(240,192,64,0.4);
  --text: #f0ece0;
  --muted: #887060;
  --glow-gold: 0 0 20px rgba(240,192,64,0.3), 0 0 40px rgba(240,192,64,0.1);
  --glow-red: 0 0 20px rgba(224,48,48,0.4), 0 0 40px rgba(224,48,48,0.15);
  --glow-gold-btn: 0 0 15px rgba(240,192,64,0.5), 0 0 30px rgba(240,192,64,0.2);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);font-family:'Rajdhani',sans-serif;color:var(--text);overflow:hidden;}

/* PARTICLES */
#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}

/* LOGIN */
#login{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
.login-bg-glow{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:300px;height:300px;background:radial-gradient(circle,rgba(240,192,64,0.08) 0%,transparent 70%);pointer-events:none;}
.login-logo-wrap{text-align:center;margin-bottom:32px;position:relative;}
.login-crown{font-size:48px;margin-bottom:8px;filter:drop-shadow(0 0 20px rgba(240,192,64,0.6));}
.login-title{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;letter-spacing:4px;color:var(--gold);text-shadow:var(--glow-gold);}
.login-sub{font-size:13px;letter-spacing:6px;color:var(--muted);margin-top:4px;}
.login-card{width:100%;max-width:340px;background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:32px 28px;position:relative;overflow:hidden;}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.login-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent);}
.lc-label{font-size:11px;letter-spacing:4px;color:var(--gold);margin-bottom:20px;text-align:center;}
.lc-divider{display:flex;align-items:center;gap:10px;margin-bottom:24px;}
.lc-divider-line{flex:1;height:1px;background:var(--border);}
.lc-divider-text{font-size:10px;letter-spacing:3px;color:var(--muted);}
.key-input{width:100%;padding:16px 18px;background:#000;border:1px solid var(--border);border-radius:12px;color:var(--gold);font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:3px;text-align:center;outline:none;transition:0.3s;margin-bottom:16px;}
.key-input::placeholder{color:rgba(240,192,64,0.3);font-size:11px;}
.key-input:focus{border-color:var(--gold);box-shadow:0 0 0 1px rgba(240,192,64,0.3),inset 0 0 20px rgba(240,192,64,0.05);}
.activate-btn{width:100%;padding:17px;background:linear-gradient(135deg,var(--gold3) 0%,var(--gold) 50%,var(--gold3) 100%);border:none;border-radius:12px;color:#000;font-family:'Orbitron',sans-serif;font-weight:900;font-size:13px;letter-spacing:3px;cursor:pointer;transition:0.2s;position:relative;overflow:hidden;}
.activate-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);transition:0.5s;}
