<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>RDX FUCK DECODER V4</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet"/>
    <style>
        /* Cyberpunk dark styling with glowing accents */
        :root {
            --bg-color: #050811;
            --card-bg: linear-gradient(145deg, #0d1527, #070a14);
            --accent-color: #2effb0;
            --accent-glow: rgba(46, 255, 176, 0.4);
            --text-color: #eef5ff;
            --text-dim: #7d96b6;
            --border-color: rgba(46, 255, 176, 0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle animated background */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #15253b, #040710);
            z-index: -2;
        }
        
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 10% 20%, rgba(46,255,176,0.06) 1px, transparent 1px);
            background-size: 30px 35px;
            z-index: -1;
            animation: drift 25s linear infinite;
        }
        
        @keyframes drift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 35px); }
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 2.5rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(46, 255, 176, 0.05);
            backdrop-filter: blur(10px);
            text-align: center;
            z-index: 10;
            margin: 2rem 0;
        }

        h1 {
            font-size: 2.3rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, #ffffff, var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(46, 255, 176, 0.2);
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        textarea {
            width: 100%;
            height: 280px;
            background-color: #080d1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.2rem;
            color: #d0ffec;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            resize: none;
            transition: all 0.3s ease;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 600px) {
            .btn-container {
                grid-template-columns: 1fr;
            }
        }

        button {
            background: linear-gradient(135deg, #163629, #0d1e17);
            border: 1px solid var(--border-color);
            color: #d0ffec;
            padding: 1rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            background: linear-gradient(135deg, var(--accent-color), #1eaa7a);
            color: #050811;
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #111520;
            border-color: rgba(255,255,255,0.05);
            color: #435165;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-decode {
            grid-column: span 2;
            background: linear-gradient(135deg, #1b4d3e, #0e291f);
            border-color: var(--accent-color);
        }

        @media (max-width: 600px) {
            .btn-decode {
                grid-column: span 1;
            }
        }

        .btn-download {
            grid-column: span 2;
            background: linear-gradient(135deg, #112a45, #0a182b);
            border-color: rgba(0, 162, 255, 0.4);
            color: #d0e4ff;
        }

        .btn-download:hover {
            background: linear-gradient(135deg, #0099ff, #0066cc);
            color: #050811;
            box-shadow: 0 0 20px rgba(0, 153, 255, 0.4);
        }

        @media (max-width: 600px) {
            .btn-download {
                grid-column: span 1;
            }
        }

        .file-info {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: -0.5rem;
            margin-bottom: 1rem;
            text-align: left;
            padding-left: 0.5rem;
            font-style: italic;
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #0f1c2b;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px var(--accent-glow);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
            opacity: 0;
            z-index: 10000;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-particles"></div>

    <div class="container">
        <h1>RDX FUCK DECODER V4</h1>
        <p class="subtitle">DEOBFUSCATE & RECOVER CLEAN ORIGINAL SOURCE CODE</p>
        
        <div class="input-group">
            <textarea id="inputBox" placeholder="Paste obfuscated HTML code here, or drag & drop / upload an encoded file..." autocomplete="off" spellcheck="false"></textarea>
        </div>

        <div id="fileInfo" class="file-info" style="display: none;"></div>

        <div class="btn-container">
            <button id="uploadBtn">📁 Upload Encoded File</button>
            <input type="file" id="fileInput" style="display: none;" accept=".html,.htm"/>
            
            <button id="decodeBtn" class="btn-decode">⚡ Decode Content</button>
            
            <button id="downloadBtn" class="btn-download" disabled>📥 Download Decoded File</button>
        </div>
    </div>

    <div id="toast" class="toast">Action Completed</div>

    <script>
        let originalFileName = "decoded_file";
        let decodedOutput = "";

        // File Uploader Trigger
        document.getElementById('uploadBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        // FileReader Handle
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                processFile(file);
            }
        });

        // Drag & Drop Handlers
        const inputBox = document.getElementById('inputBox');
        inputBox.addEventListener('dragover', (e) => {
            e.preventDefault();
            inputBox.style.borderColor = 'var(--accent-color)';
        });
        inputBox.addEventListener('dragleave', () => {
            inputBox.style.borderColor = 'rgba(255, 255, 255, 0.1)';
        });
        inputBox.addEventListener('drop', (e) => {
            e.preventDefault();
            inputBox.style.borderColor = 'rgba(255, 255, 255, 0.1)';
            const file = e.dataTransfer.files[0];
            if (file && (file.name.endsWith('.html') || file.name.endsWith('.htm'))) {
                processFile(file);
            } else {
                showToast("⚠️ Please drop a valid HTML file");
            }
        });

        function processFile(file) {
            originalFileName = file.name.replace(/\.[^/.]+$/, "");
            const reader = new FileReader();
            reader.onload = function(evt) {
                document.getElementById('inputBox').value = evt.target.result;
                const fileInfo = document.getElementById('fileInfo');
                fileInfo.innerText = `📂 Loaded: ${file.name}`;
                fileInfo.style.display = 'block';
                showToast(`Loaded ${file.name}`);
            };
            reader.readAsText(file);
        }

        // DECODER LOGIC ENGINE
        function decodeCssContent(contentStr) {
            let cleaned = contentStr.replace(/^['"]|['"]$/g, '').trim();
            const matches = cleaned.match(/\\+[0-9a-fA-F]+/g);
            if (!matches) {
                return cleaned;
            }
            return matches.map(match => {
                const hex = match.replace(/^\\+/, '');
                try {
                    return String.fromCodePoint(parseInt(hex, 16));
                } catch (e) {
                    return "";
                }
            }).join('');
        }

        function decryptScript(scriptText) {
            let decryptedCode = "";
            const sandbox = {
                window: {},
                eval: function(code) {
                    decryptedCode += code + "\n";
                },
                document: {}

            const proxyHandler = {
                get(target, prop) {
                    if (prop === 'eval') return sandbox.eval;
                    if (prop === 'window') return sandbox.window;
                    if (prop === 'document') return sandbox.document;
                    if (prop === 'globalThis') return sandbox.window;
                    
                    const mock = function() { return mock; };
                    mock._x = function(code) {
                        decryptedCode += code + "\n";
                        return mock;
                    };
                    mock.concat = function(a) { return Array.isArray(a) ? a : []; };
                    mock.slice = function() { return []; };
                    mock.match = function() { return []; };
                    return mock;
                },
                set(target, prop, value) {
                    return true;
                }
            };
            
            sandbox.window = new Proxy({}, proxyHandler);
            sandbox.document = new Proxy({}, proxyHandler);
            
            try {
                const run = new Function("window", "eval", "document", "self", "top", "parent", "globalThis", "navigator", "location", scriptText);
                run(sandbox.window, sandbox.eval, sandbox.document, sandbox.window, sandbox.window, sandbox.window, sandbox.window, sandbox.window, sandbox.window);
            } catch (e) {
                // Silently bypass simulation boundary stops
            }
            
            return decryptedCode;
        }

        function decodeHTML(htmlContent) {
            const rules = {};
            const styleRegex = /<style[^>]*>([\s\S]*?)<\/style>/gi;
            let match;
            let sEtoStyleTag = null;
            
            while ((match = styleRegex.exec(htmlContent)) !== null) {
                const styleText = match[1];
                if (styleText.includes('s-eto')) {
                    sEtoStyleTag = match[0];
                    const ruleRegex = /#([a-zA-Z0-9_-]+):+:before\s*\{\s*content\s*:\s*([^;}]+)\s*;?\s*\}/gi;
                    let ruleMatch;
                    while ((ruleMatch = ruleRegex.exec(styleText)) !== null) {
                        const id = ruleMatch[1];
                        const content = ruleMatch[2];
                        rules[id] = decodeCssContent(content);
                    }
                }
            }
            
            let decodedHtml = htmlContent;
            const parser = new DOMParser();
            const doc = parser.parseFromString(decodedHtml, 'text/html');
            
            // Restore elements representing custom tags
            const sEtos = doc.querySelectorAll('s-eto');
            sEtos.forEach(el => {
                const id = el.getAttribute('id');
                if (id && rules[id] !== undefined) {
                    const textNode = doc.createTextNode(rules[id]);
                    el.parentNode.replaceChild(textNode, el);
                }
            });
            
            // Clean dynamic helper CSS injection
            if (sEtoStyleTag) {
                const styleTags = doc.querySelectorAll('style');
                styleTags.forEach(style => {
                    if (style.textContent.includes('s-eto')) {
                        style.remove();
                    }
                });
            }
            
            // Decrypt script layers safely
            const scriptTags = doc.querySelectorAll('script');
            scriptTags.forEach(script => {
                const scriptText = script.textContent;
                if (scriptText.includes('eval') && 
                   (scriptText.includes('_xaMzEdGx') || 
                    scriptText.includes('_o9MZPdaJ') || 
                    scriptText.includes('_ayVZcO8Eg') || 
                    scriptText.includes('_csdsUKQwG') ||
                    scriptText.includes('window[\'_') ||
                    scriptText.match(/var\s+_[a-zA-Z0-9]{8,15}\s*=\s*\[\s*\d+/))) {
                    
                    const decrypted = decryptScript(scriptText);
                    if (decrypted && decrypted.trim().length > 0) {
                        script.textContent = "\n" + decrypted.trim() + "\n";
                    }
                }
            });
            
            let outputHTML = doc.documentElement.outerHTML;
            if (!outputHTML.match(/^<!DOCTYPE/i)) {
                outputHTML = "<!DOCTYPE html>\n" + outputHTML;
            }
            
            // Clear obfuscator header blocks
            const headerCommentRegex = /<!--\s*╔══════════════════════════════════════════════════════════╗[\s\S]*?╚══════════════════════════════════════════════════════════╝\s*-->/gi;
            outputHTML = outputHTML.replace(headerCommentRegex, '');
            
            return outputHTML;
        }

        // Action Handlers
        document.getElementById('decodeBtn').addEventListener('click', () => {
            const code = inputBox.value.trim();
            if (!code) {
                showToast("⚠️ Please enter or drop HTML code!");
                return;
            }
            
            showToast("⚡ Processing decryption...");
            
            setTimeout(() => {
                try {
                    const decoded = decodeHTML(code);
                    decodedOutput = decoded;
                    inputBox.value = decoded;
                    
                    document.getElementById('downloadBtn').disabled = false;
                    showToast("✅ Code Decoded Successfully!");
                } catch (e) {
                    console.error(e);
                    showToast("❌ Decryption error, check code structure.");
                }
            }, 400);
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (!decodedOutput) return;
            
            const blob = new Blob([decodedOutput], { type: 'text/html;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.setAttribute("download", `${originalFileName}_RDX_fuck_dark_decoder.html`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("💾 File Downloaded Successfully!");
        });

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
