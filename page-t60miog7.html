<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
<link href='https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap' rel='stylesheet'>
<style>
:root{
  --p-50:#EDE4FF; --p-300:#8B6FD8; --p-400:#6E4FC4; --p-500:#5B33B0;
  --p-600:#4A1F95; --p-700:#3A1576; --p-800:#2A0E5A; --p-900:#1A063D;
  --gold:#FFD27A; --gold-2:#F0B84A;
  --glass-stroke: rgba(196,181,253,0.40);
  --glass-stroke-2: rgba(255,255,255,0.18);
  --ink:#EDE9FE; --ink-dim:#C4B5FD; --ink-mute:#9b8cc7;
  --good:#86EFAC; --bad:#FCA5A5;
  --shadow-float: 0 30px 70px -14px rgba(76,29,149,0.65), 0 10px 28px -10px rgba(0,0,0,0.6);
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Space Grotesk',system-ui,sans-serif}
html,body{margin:0;padding:0;width:100%;height:100%;background:transparent!important;overflow:hidden!important;color:var(--ink);touch-action:none}
#mini,#main-wrapper{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none;will-change:left,top}
#mini.dragging,#main-wrapper.dragging{transition:none!important;cursor:grabbing!important}
#mini{cursor:grab}
.drag-handle{cursor:grab;touch-action:none}
.drag-handle:active{cursor:grabbing}
.grip{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:34px;height:5px;border-radius:4px;background:linear-gradient(90deg,rgba(196,181,253,.15),rgba(196,181,253,.75),rgba(196,181,253,.15));box-shadow:0 0 10px rgba(167,139,250,.55),inset 0 1px 0 rgba(255,255,255,.4);z-index:20;pointer-events:none}

/* ============ keyframes ============ */
@keyframes animatedGlow{
  0%{box-shadow:0 0 22px var(--p-500),inset 0 0 16px rgba(139,92,246,.5);border-color:var(--p-400)}
  50%{box-shadow:0 0 42px var(--p-400),inset 0 0 24px rgba(167,139,250,.6);border-color:var(--p-300)}
  100%{box-shadow:0 0 22px var(--p-500),inset 0 0 16px rgba(139,92,246,.5);border-color:var(--p-400)}
}
@keyframes toolHover{0%{transform:translateY(3px)}100%{transform:translateY(-3px)}}
@keyframes spinLoader{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes spinLoaderRev{0%{transform:rotate(360deg)}100%{transform:rotate(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes slideGlow{0%{background-position:0 0}100%{background-position:200% 0}}
@keyframes dragonPulse{0%,100%{transform:translateX(-50%) scale(1);opacity:.85}50%{transform:translateX(-50%) scale(1.08);opacity:1}}
@keyframes pulseRing{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.6);opacity:0}}
@keyframes orbSpin{to{transform:rotate(360deg)}}
@keyframes popIn{from{transform:scale(.92);opacity:0;filter:blur(8px)}to{transform:scale(1);opacity:1;filter:blur(0)}}
@keyframes flapL{0%{transform:translateY(-50%) perspective(600px) rotateY(8deg) rotateZ(4deg)}100%{transform:translateY(-50%) perspective(600px) rotateY(48deg) rotateZ(-8deg)}}
@keyframes flapR{0%{transform:translateY(-50%) perspective(600px) rotateY(-8deg) rotateZ(-4deg)}100%{transform:translateY(-50%) perspective(600px) rotateY(-48deg) rotateZ(8deg)}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ============ Premium scan keyframes ============ */
@keyframes radarSweep{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes hexPulse{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.55;transform:scale(1.04)}}
@keyframes coreGlow{0%,100%{box-shadow:0 0 22px var(--p-400),inset 0 0 14px rgba(255,255,255,.35);transform:scale(1)}50%{box-shadow:0 0 46px var(--p-300),0 0 80px rgba(167,139,250,.55),inset 0 0 22px rgba(255,255,255,.55);transform:scale(1.06)}}
@keyframes dataStream{0%{transform:translateY(-120%)}100%{transform:translateY(120%)}}
@keyframes gridDrift{0%{background-position:0 0,0 0}100%{background-position:36px 36px,36px 36px}}
@keyframes scanLine{0%{transform:translateY(-100%);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(200%);opacity:0}}
@keyframes crossHair{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ticker{0%{transform:translateY(0)}100%{transform:translateY(-100%)}}
@keyframes numFlip{0%{transform:translateY(-100%);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes ringFade{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.8);opacity:0}}
@keyframes chipFlash{0%,100%{background-color:rgba(139,111,216,.15)}50%{background-color:rgba(139,111,216,.45)}}
@keyframes barPulse{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}

/* ============ Panel wrapper ============ */
#main-wrapper{position:relative;display:flex;align-items:center;justify-content:center;animation:toolHover .9s ease-in-out infinite alternate;z-index:10;width:380px;height:280px}

.wing{position:absolute;top:50%;width:130px;height:150px;z-index:1;pointer-events:none;
  background:radial-gradient(closest-side, rgba(167,139,250,.55), rgba(124,58,237,.15) 60%, transparent 75%);
  filter:blur(6px);
}
.w-left{right:50%;margin-right:120px;transform-origin:right center;animation:flapL 1.2s ease-in-out infinite alternate}
.w-right{left:50%;margin-left:120px;transform-origin:left center;animation:flapR 1.2s ease-in-out infinite alternate}

/* PANEL — premium violet glass */
#main{
  width:248px;height:260px;
  background:linear-gradient(135deg, rgba(91,33,182,.6) 0%, rgba(20,10,40,.7) 100%);
  border:1px solid var(--glass-stroke);
  border-radius:28px;
  display:none;flex-direction:column;gap:6px;position:relative;padding:12px;
  animation:animatedGlow 2.2s infinite ease-in-out;
  z-index:10;
  -webkit-backdrop-filter:blur(38px) saturate(190%);
  backdrop-filter:blur(38px) saturate(190%);
  box-shadow: var(--shadow-float), inset 0 1px 0 rgba(255,255,255,.26);
}
#main::before{content:'';position:absolute;inset:0;border-radius:28px;pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.24), transparent 38%);mix-blend-mode:overlay;opacity:.85}
#main::after{content:'';position:absolute;inset:0;border-radius:28px;pointer-events:none;
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(196,181,253,.3), transparent 55%),
    radial-gradient(80% 40% at 50% 110%, rgba(124,58,237,.4), transparent 60%);
  mix-blend-mode:screen}

.grid-bg{position:absolute;width:100%;height:100%;top:0;left:0;border-radius:27px;
  background:
    radial-gradient(circle at 20% 0%, rgba(196,181,253,.22), transparent 40%),
    repeating-linear-gradient(45deg, rgba(196,181,253,.06) 0, rgba(196,181,253,.06) 1px, transparent 1px, transparent 14px);
  z-index:0;pointer-events:none}

.header{display:flex;justify-content:space-between;align-items:center;width:100%;z-index:3;margin:0 0 2px 0;position:relative}
.title-text{font-family:'Orbitron',sans-serif;font-size:11px;color:#fff;text-shadow:0 0 10px var(--p-400),0 0 20px rgba(139,92,246,.5);letter-spacing:1.6px;font-weight:900;display:flex;align-items:center;gap:6px}
.title-text::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--p-300);box-shadow:0 0 12px var(--p-300),0 0 4px #fff inset}
.close-btn{color:#fff;font-size:12px;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.04));border:1px solid var(--glass-stroke);border-radius:10px;font-weight:800;width:24px;height:22px;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);line-height:1}
.close-btn:active{transform:scale(.92)}

.sys-bar{width:100%;display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(20,10,40,.6));
  border:1px solid var(--glass-stroke);border-radius:14px;
  padding:5px 9px;margin-bottom:2px;color:#fff;font-family:'Orbitron',sans-serif;
  font-size:7px;font-weight:700;text-shadow:0 0 6px var(--p-400);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);z-index:2;position:relative;overflow:hidden}
.sys-bar::after{content:'';position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);animation:shimmer 3.2s linear infinite}
.live-dot{display:inline-block;width:6px;height:6px;background:var(--p-300);border-radius:50%;animation:blink .9s infinite;margin-right:5px;box-shadow:0 0 10px var(--p-300)}

#content{flex:1;display:flex;flex-direction:column;gap:6px;z-index:2;width:100%;min-height:0}

.ai-result-box{width:100%;flex:1;border:1px solid var(--glass-stroke);border-radius:18px;padding:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(160deg, rgba(124,58,237,.3), rgba(20,10,40,.6));
  -webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 12px 32px rgba(76,29,149,.5);position:relative;overflow:hidden}
.ai-result-box::before{content:'';position:absolute;inset:0;background:
  radial-gradient(70% 50% at 50% 0%, rgba(255,255,255,.22), transparent 60%),
  radial-gradient(60% 40% at 50% 110%, rgba(167,139,250,.28), transparent 60%);pointer-events:none}
.ai-result-box::after{content:'';position:absolute;top:0;left:-60%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);animation:shimmer 4s linear infinite;pointer-events:none}

.spider-ring{width:46px;height:46px;border-radius:50%;border:2px solid var(--p-300);background:radial-gradient(circle at 30% 30%, var(--p-400), var(--p-900));display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 22px rgba(167,139,250,.75), inset 0 0 12px rgba(255,255,255,.2);position:relative;z-index:2}
.spider-img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;filter:saturate(120%) hue-rotate(240deg)}
.spider-spin{animation:spinLoader 2.5s linear infinite}

.dragon-loader{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:26px;animation:dragonPulse 1.4s ease-in-out infinite;z-index:25;filter:drop-shadow(0 0 12px var(--p-400));display:none;pointer-events:none}

.text-group{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;z-index:2}
.status-title{font-family:'Orbitron',sans-serif;font-size:11px;color:#fff;text-shadow:0 0 12px var(--p-300),0 0 24px var(--p-500);text-align:center;font-weight:800;letter-spacing:.9px}
.status-sub{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:800;color:var(--p-300);text-align:center;margin-top:2px;text-shadow:0 0 8px var(--p-500)}
.status-desc{font-family:'Rajdhani',sans-serif;font-size:9px;font-weight:600;color:var(--ink-dim);text-align:center;letter-spacing:.3px}

.buttons-area{display:flex;gap:6px;width:100%;z-index:2;margin-top:4px}
.btn{flex:1;padding:9px 0;border-radius:14px;font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.7px;cursor:pointer;border:1px solid var(--glass-stroke);transition:transform .12s, box-shadow .25s;font-weight:800;position:relative;overflow:hidden;color:#fff}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,.3), transparent 45%);pointer-events:none}
.btn::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transition:left .5s}
.btn:hover::after{left:120%}
.btn:active{transform:scale(.95)}
.btn-action{background:linear-gradient(180deg, var(--p-400) 0%, var(--p-700) 60%, var(--p-900) 100%);color:#fff;
  box-shadow:0 8px 24px rgba(124,58,237,.65), inset 0 1px 0 rgba(255,255,255,.4)}

.progress-bar{width:88%;height:6px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin-top:6px;border:1px solid var(--glass-stroke);box-shadow:inset 0 1px 2px rgba(0,0,0,.4);position:relative;z-index:2}
.progress-fill{height:100%;background:linear-gradient(90deg, var(--p-700), var(--p-300), var(--p-700));background-size:200% 100%;border-radius:6px;animation:slideGlow 2s linear infinite;transition:width .1s linear;box-shadow:0 0 14px rgba(167,139,250,.85)}

/* ============ PREMIUM SCAN STAGE ============ */
.scan-stage{position:relative;width:100%;flex:1;border-radius:18px;overflow:hidden;
  border:1px solid var(--glass-stroke);
  background:
    radial-gradient(circle at 50% 50%, rgba(139,111,216,.28), rgba(20,10,40,.85) 70%),
    linear-gradient(160deg, rgba(74,31,149,.4), rgba(20,10,40,.9));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 12px 32px rgba(76,29,149,.55);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;gap:5px}
.scan-grid{position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:
    linear-gradient(rgba(196,181,253,.14) 1px, transparent 1px),
    linear-gradient(90deg, rgba(196,181,253,.14) 1px, transparent 1px);
  background-size:18px 18px, 18px 18px;
  animation:gridDrift 6s linear infinite;
  mask-image:radial-gradient(circle at 50% 50%, #000 55%, transparent 85%)}
.scan-line{position:absolute;left:0;right:0;top:0;height:38%;pointer-events:none;
  background:linear-gradient(180deg, transparent 0%, rgba(167,139,250,.28) 45%, rgba(255,255,255,.55) 50%, rgba(167,139,250,.28) 55%, transparent 100%);
  filter:blur(1px);animation:scanLine 2.4s ease-in-out infinite}
.cross-h,.cross-v{position:absolute;background:rgba(196,181,253,.35);pointer-events:none;animation:crossHair 1.6s ease-in-out infinite}
.cross-h{left:8%;right:8%;top:50%;height:1px}
.cross-v{top:8%;bottom:8%;left:50%;width:1px}

.radar-core{position:relative;width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(139,111,216,.4), rgba(30,10,60,.9) 70%);
  border:1px solid rgba(196,181,253,.35);
  box-shadow:0 0 26px rgba(139,111,216,.65), inset 0 0 20px rgba(167,139,250,.35);
  display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:3}
.radar-core::before,.radar-core::after{content:'';position:absolute;border-radius:50%;border:1px solid rgba(196,181,253,.28);pointer-events:none}
.radar-core::before{inset:12px}
.radar-core::after{inset:26px}
.radar-sweep{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg, transparent 0deg, rgba(167,139,250,.55) 40deg, transparent 80deg);
  animation:radarSweep 2.2s linear infinite;mask-image:radial-gradient(circle, #000 60%, transparent 100%)}
.radar-ping{position:absolute;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 12px #fff, 0 0 22px var(--p-300);animation:ringFade 1.6s ease-out infinite}
.radar-ping.p2{animation-delay:.55s;background:var(--p-300)}
.radar-ping.p3{animation-delay:1.1s}
.radar-core .core-orb{position:relative;width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 30% 25%, #fff, var(--p-300) 40%, var(--p-700) 100%);
  box-shadow:0 0 20px var(--p-300), inset 0 -6px 10px rgba(0,0,0,.4);
  animation:coreGlow 1.6s ease-in-out infinite;z-index:4;display:flex;align-items:center;justify-content:center;font-size:14px}

.hex-ring{position:absolute;inset:-8px;border-radius:50%;border:1px dashed rgba(196,181,253,.45);animation:orbSpin 8s linear infinite}
.hex-ring.r2{inset:-16px;border:1px dotted rgba(255,255,255,.25);animation:orbSpin 12s linear infinite reverse}

.data-column{position:absolute;top:0;bottom:0;width:10px;pointer-events:none;overflow:hidden;opacity:.85;font-family:'Orbitron',sans-serif;font-size:8px;color:var(--p-300);text-shadow:0 0 6px var(--p-400);line-height:10px}
.data-column.dc1{left:6px}
.data-column.dc2{right:6px}
.data-column .stream{animation:dataStream 3.2s linear infinite;writing-mode:vertical-rl;letter-spacing:2px}
.data-column.dc2 .stream{animation-duration:4s;animation-delay:.6s;color:#fff}

.scan-hud{width:100%;display:flex;justify-content:space-between;align-items:center;
  font-family:'Orbitron',sans-serif;font-size:7px;font-weight:800;color:var(--p-300);
  padding:0 4px;letter-spacing:1px;text-shadow:0 0 6px var(--p-500);z-index:4;position:relative}
.scan-hud .chip{padding:2px 6px;border-radius:8px;background:rgba(139,111,216,.18);border:1px solid rgba(196,181,253,.3);animation:chipFlash 1.4s ease-in-out infinite;color:#fff}
.scan-hud .chip.b{animation-delay:.35s}
.scan-hud .chip.c{animation-delay:.7s}

.scan-status{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:800;color:#fff;letter-spacing:1.2px;text-shadow:0 0 10px var(--p-300);z-index:4;position:relative;text-align:center;min-height:11px;animation:flicker 1.8s ease-in-out infinite}

.eq-bars{display:flex;gap:2px;align-items:flex-end;height:12px;z-index:4;position:relative}
.eq-bars span{display:block;width:2px;height:100%;background:linear-gradient(180deg, #fff, var(--p-300));border-radius:1px;transform-origin:bottom;animation:barPulse .9s ease-in-out infinite}
.eq-bars span:nth-child(1){animation-delay:0s}
.eq-bars span:nth-child(2){animation-delay:.08s}
.eq-bars span:nth-child(3){animation-delay:.16s}
.eq-bars span:nth-child(4){animation-delay:.24s}
.eq-bars span:nth-child(5){animation-delay:.32s}
.eq-bars span:nth-child(6){animation-delay:.40s}
.eq-bars span:nth-child(7){animation-delay:.48s}

.prog-wrap{width:92%;display:flex;flex-direction:column;gap:3px;z-index:4;position:relative;margin-top:2px}
.prog-meta{display:flex;justify-content:space-between;font-family:'Orbitron',sans-serif;font-size:7px;color:var(--ink-dim);letter-spacing:.8px}
.prog-meta b{color:#fff;text-shadow:0 0 8px var(--p-300)}
.prog-bar2{height:5px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;border:1px solid var(--glass-stroke);position:relative;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.prog-fill2{height:100%;width:0%;background:linear-gradient(90deg, var(--p-700), #fff, var(--p-300), var(--p-700));background-size:200% 100%;animation:slideGlow 1.4s linear infinite;box-shadow:0 0 12px var(--p-300);transition:width .12s linear;border-radius:6px}

/* ============ PREMIUM RESULT ============ */
.result-stage{position:relative;width:100%;flex:1;border-radius:18px;overflow:hidden;
  border:1px solid var(--glass-stroke);
  background:
    radial-gradient(circle at 50% 20%, rgba(196,181,253,.35), rgba(20,10,40,.85) 70%),
    linear-gradient(160deg, rgba(124,58,237,.35), rgba(20,10,40,.85));
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 14px 34px rgba(76,29,149,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px;
  animation:popIn .5s ease-out}
.result-stage::before{content:'';position:absolute;inset:0;background:
  radial-gradient(60% 40% at 50% 0%, rgba(255,255,255,.24), transparent 60%),
  radial-gradient(70% 45% at 50% 110%, rgba(167,139,250,.35), transparent 60%);pointer-events:none}
.result-stage::after{content:'';position:absolute;top:0;left:-60%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);animation:shimmer 3.6s linear infinite;pointer-events:none}

.result-badge{font-family:'Orbitron',sans-serif;font-size:7px;font-weight:800;letter-spacing:2px;color:var(--p-300);padding:3px 10px;border:1px solid rgba(196,181,253,.4);border-radius:10px;background:rgba(139,111,216,.15);text-shadow:0 0 6px var(--p-500);z-index:2}

.result-core{display:flex;align-items:center;justify-content:center;gap:10px;z-index:2;position:relative;animation:popIn .55s ease-out}
.result-sz{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;letter-spacing:1.6px;
  background:linear-gradient(180deg,#fff 0%, var(--p-300) 60%, var(--p-500) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 22px rgba(196,181,253,.6);position:relative}
.result-sz::after{content:'';position:absolute;left:0;right:0;bottom:-3px;height:2px;background:linear-gradient(90deg,transparent,var(--p-300),transparent);box-shadow:0 0 10px var(--p-300)}

.num-pair{display:flex;align-items:center;gap:2px;font-family:'Orbitron',sans-serif;font-weight:900;
  padding:4px 10px;border-radius:14px;border:1px solid rgba(196,181,253,.45);
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(20,10,40,.55));
  box-shadow:0 6px 18px rgba(76,29,149,.55), inset 0 1px 0 rgba(255,255,255,.4);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:popIn .6s ease-out}
.num-pair .n{font-size:24px;color:#fff;text-shadow:0 0 14px var(--p-300),0 0 26px var(--p-500);display:inline-block;animation:numFlip .5s ease-out}
.num-pair .n.n2{animation-delay:.12s}

#mini img{width:60%;height:60%;object-fit:cover;border-radius:50%;position:relative;z-index:4;background:transparent;filter:saturate(120%) hue-rotate(240deg) brightness(1.1);box-shadow:0 4px 14px rgba(0,0,0,.5)}

<div id='mini'>
    <div class='spin-ring-1'></div>
    <div class='spin-ring-2'></div>
    <img src='https://files.catbox.moe/f080f3.jpg' onerror="this.onerror=null; this.src='https://files.catbox.moe/4y1fyj.jpg';" draggable="false">
</div>

<div id='main-wrapper' style='display:none;'>
    <div class='dragon-loader' id='dragon-icon'>🐇</div>
    <div class='wing w-left'></div>
    <div class='wing w-right'></div>

        <div class='grid-bg'></div>
        <div class='grip'></div>
        <div class='header drag-handle' id='drag-header' style='margin-top:6px'>
            <div class='title-text'>BETMAN</div>
            <button class="close-btn" onclick="closeM(event)">✕</button>
        </div>
        <div class='sys-bar drag-handle'>
            <div style='display:flex; align-items:center;'><span class='live-dot'></span>LIVE</div>
            <div>MOD : ACTIVE</div>
            <div id='ping-text'>PING : 20MS</div>
        </div>
        <div id='content'></div>
    </div>
</div>

<script>
// ==================== PREDICTION ENGINE (No Deposit/Register) ====================
var state = 'ready';
var isScanning = false;
var currentResultSz = 'BIG';
var currentResultNum = '1/5';
var currentPeriod = null;
var lastGeneratedPeriod = null;
var isOpen = false;
var progressInterval = null;
var scanStatusInterval = null;

var spiderImg = '<img class="spider-img" src="https://files.catbox.moe/f080f3.jpg" onerror="this.onerror=null; this.src=\'https://files.catbox.moe/4y1fyj.jpg\';">';
var spiderImgSpin = '<img class="spider-img spider-spin" src="https://files.catbox.moe/f080f3.jpg" onerror="this.onerror=null; this.src=\'https://files.catbox.moe/4y1fyj.jpg\';">';

// ===== PREMIUM PREDICTION POOL =====
var predictionPool = [
    {sz:'BIG',   pair:'1/5'},
    {sz:'BIG',   pair:'6/8'},
    {sz:'BIG',   pair:'7/5'},
    {sz:'BIG',   pair:'8/9'},
    {sz:'BIG',   pair:'5/8'},
    {sz:'SMALL', pair:'1/3'},
    {sz:'SMALL', pair:'0/5'},
    {sz:'SMALL', pair:'4/2'},
    {sz:'SMALL', pair:'0/4'},
    {sz:'SMALL', pair:'3/0'}
];

function getPeriod() {
    var d = new Date();
    var utc = new Date(d.toLocaleString('en-US', {timeZone: 'UTC'}));
    utc.setMinutes(utc.getMinutes() + 330);
    var total = utc.getUTCHours() * 60 + utc.getUTCMinutes();
    var periodSuffix = String(10001 + total);
    return periodSuffix.slice(-5);
}

setInterval(function() {
    var pt = document.getElementById('ping-text');
    if(pt) {
        pt.innerText = 'PING : ' + (Math.floor(Math.random() * 21) + 18) + 'MS';
    }
}, 1200);

function syncPos(from, to){
    var r = from.getBoundingClientRect();
    var w = to.offsetWidth || 380, h = to.offsetHeight || 280;
    var cx = r.left + r.width/2, cy = r.top + r.height/2;
    var nx = Math.max(4, Math.min(window.innerWidth  - w - 4, cx - w/2));
    var ny = Math.max(4, Math.min(window.innerHeight - h - 4, cy - h/2));
    to.style.transform='none';
    to.style.left = nx+'px';
    to.style.top  = ny+'px';
}

function openM() {
    if(isOpen) return;
    isOpen = true;

    var mini = document.getElementById('mini');
    var wrap = document.getElementById('main-wrapper');
    wrap.style.display = 'flex';
    document.getElementById('main').style.display = 'flex';
    requestAnimationFrame(function(){ syncPos(mini, wrap); mini.style.display='none'; });
    document.getElementById('dragon-icon').style.display = 'block';
    render();
}

function closeM(ev) {
    if(ev){ ev.stopPropagation(); ev.preventDefault(); }
    isOpen = false;

    var wrap = document.getElementById('main-wrapper');
    var mini = document.getElementById('mini');
    mini.style.display = 'flex';
    requestAnimationFrame(function(){ syncPos(wrap, mini); wrap.style.display='none'; });
    document.getElementById('dragon-icon').style.display = 'none';
    if(progressInterval) clearInterval(progressInterval);
    if(scanStatusInterval) clearInterval(scanStatusInterval);
}

// ==================== DRAGGABLE ====================
function makeDraggable(el, handleSelector, onTap){
    var dragging=false, moved=false, sx=0, sy=0, ox=0, oy=0, pid=null;
    var startTime=0;
    function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
    function onDown(e){
        if(handleSelector){
            var h = e.target.closest(handleSelector);
            if(!h || !el.contains(h)) return;
        }
        if(e.target.closest('button,.close-btn,.btn')) return;
        dragging=true; moved=false; startTime=Date.now();
        var r = el.getBoundingClientRect();
        el.style.transform='none';
        el.style.left = r.left+'px';
        el.style.top  = r.top+'px';
        ox = r.left; oy = r.top;
        sx = e.clientX; sy = e.clientY;
        pid = e.pointerId;
        try{ el.setPointerCapture(pid); }catch(_){}
        el.classList.add('dragging');
        e.preventDefault();
    }
    function onMove(e){
        if(!dragging) return;
        var dx = e.clientX - sx, dy = e.clientY - sy;
        if(Math.abs(dx)>4 || Math.abs(dy)>4) moved=true;
        var w = el.offsetWidth, h = el.offsetHeight;
        var nx = clamp(ox+dx, 4, window.innerWidth - w - 4);
        var ny = clamp(oy+dy, 4, window.innerHeight - h - 4);
        el.style.left = nx+'px';
        el.style.top  = ny+'px';
    }
    function onUp(e){
        if(!dragging) return;
        dragging=false;
        el.classList.remove('dragging');
        try{ el.releasePointerCapture(pid); }catch(_){}
        var dt = Date.now()-startTime;
        if(!moved && dt < 400 && typeof onTap==='function'){ onTap(e); }
    }
    el.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
}

function initDrag(){
    var mini = document.getElementById('mini');
    var wrap = document.getElementById('main-wrapper');
    if(mini && !mini._dragInit){ mini._dragInit=true; makeDraggable(mini, null, function(){ openM(); }); }
    if(wrap && !wrap._dragInit){ wrap._dragInit=true; makeDraggable(wrap, '.drag-handle, .grip, #drag-header, .sys-bar, .title-text'); }
}

function actionClick() {
    if(!isScanning) {
        var currentLivePeriod = getPeriod();
        if(lastGeneratedPeriod === currentLivePeriod) {
            state = 'scanning';
            render();
            startProgressTimer();
        } else {
            generateNewResult();
        }
    }
}

function generateNewResult() {
    isScanning = true;
    currentPeriod = getPeriod();
    lastGeneratedPeriod = currentPeriod;
    state = 'scanning';
    render();
    startProgressTimer();
}

function startProgressTimer() {
    if(progressInterval) clearInterval(progressInterval);
    if(scanStatusInterval) clearInterval(scanStatusInterval);

    var scanPhases = [
        'INITIALIZING NEURAL CORE',
        'HANDSHAKING WITH SERVER',
        'FETCHING PERIOD SIGNATURE',
        'DECRYPTING QUANTUM DATA',
        'ANALYZING PATTERN MATRIX',
        'CROSS-VERIFYING NODES',
        'LOCKING PREDICTION VECTOR',
        'FINALIZING SECURE OUTPUT'
    ];
    var phaseIdx = 0;
    var setPhase = function(){
        var el = document.getElementById('scan-status');
        if(el) el.innerText = '> '+scanPhases[phaseIdx % scanPhases.length];
        phaseIdx++;
    };
    setPhase();
    scanStatusInterval = setInterval(setPhase, 600);

    var p = 0;
    progressInterval = setInterval(function() {
        p += 2;
        var pt = document.getElementById('prog-txt');
        var pf = document.getElementById('prog-fill');
        var pm = document.getElementById('prog-meta-pct');
        if(pt && pf) {
            pt.innerText = p + '%';
            pf.style.width = p + '%';
        }
        if(pm) pm.innerText = p + '%';
        if(p >= 100) {
            clearInterval(progressInterval);
            if(scanStatusInterval) clearInterval(scanStatusInterval);
            setTimeout(executeFinalCalculations, 200);
        }
    }, 60);
}

function pickFromPool() {
    var currentIntPeriod = parseInt(getPeriod()) || 0;
    var seed = (currentIntPeriod + new Date().getUTCSeconds() + Math.floor(Math.random()*1000)) % predictionPool.length;
    return predictionPool[seed];
}

function executeFinalCalculations() {
    var pick = pickFromPool();
    currentResultSz = pick.sz;
    currentResultNum = pick.pair;

    state = 'result';
    isScanning = false;
    render();
}

function buildDataStream(){
    var s='';
    var chars='01ABX#$%';
    for(var i=0;i<40;i++) s+=chars[Math.floor(Math.random()*chars.length)];
    return s;
}

function render() {
    var cont = document.getElementById('content');
    if(!cont) return;

    if(state == 'ready') {
        cont.innerHTML = `
            <div class="ai-result-box">
                <div class="spider-ring">${spiderImg}</div>
                <div class="text-group">
                    <div class="status-title">🐇 BETMAN PREDICTOR</div>
                    <div class="status-sub">AI POWERED</div>
                    <div class="status-desc">CLICK START TO GENERATE PREDICTION</div>
                </div>
            </div>
            <div class="buttons-area">
                <button class="btn btn-action" onclick="actionClick()">START PREDICTION</button>
            </div>
        `;
    }
    else if(state == 'scanning') {
        cont.innerHTML = `
            <div class="scan-stage">
                <div class="scan-grid"></div>
                <div class="scan-line"></div>
                <div class="cross-h"></div>
                <div class="cross-v"></div>
                <div class="data-column dc1"><div class="stream">${buildDataStream()}</div></div>
                <div class="data-column dc2"><div class="stream">${buildDataStream()}</div></div>

                <div class="scan-hud">
                    <div class="chip">AI</div>
                    <div class="chip b">NEURAL</div>
                    <div class="chip c">SECURE</div>
                </div>

                <div class="radar-core">
                    <div class="hex-ring"></div>
                    <div class="hex-ring r2"></div>
                    <div class="radar-sweep"></div>
                    <div class="radar-ping"></div>
                    <div class="radar-ping p2"></div>
                    <div class="radar-ping p3"></div>
                    <div class="core-orb">🐇</div>
                </div>

                <div class="scan-status" id="scan-status">> INITIALIZING NEURAL CORE</div>

                <div class="eq-bars">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                </div>

                <div class="prog-wrap">
                    <div class="prog-meta">
                        <span>DECRYPT</span>
                        <b id="prog-meta-pct">0%</b>
                        <span>LOCK</span>
                    </div>
                    <div class="prog-bar2"><div class="prog-fill2" id="prog-fill" style="width:0%;"></div></div>
                </div>

                <div style="display:none;" id="prog-txt">0%</div>
            </div>
            <div class="buttons-area">
                <button class="btn btn-action" style="opacity:0.6; pointer-events:none;">⚡ INJECTING...</button>
            </div>
        `;
    }
    else if(state == 'result') {
        var last5 = currentPeriod ? currentPeriod.slice(-5) : getPeriod().slice(-5);
        var pair = (currentResultNum + '').split('/');
        var n1 = pair[0] || '0';
        var n2 = pair[1] || '0';
        var confidence = (90 + Math.floor(Math.random()*10));

        cont.innerHTML = `
            <div class="result-stage">
                <div class="result-badge">✦ AI LOCKED PREDICTION ✦</div>
                <div class="result-core">
                    <div class="result-sz">${currentResultSz}</div>
                    <div class="num-pair">
                        <span class="n">${n1}</span>
                        <span class="sep">/</span>
                        <span class="n n2">${n2}</span>
                    </div>
                </div>
                <div class="result-meta">
                    <div class="meta-chip">ACC <b>${confidence}%</b></div>
                    <div class="meta-chip">MODE <b>PREMIUM</b></div>
                </div>
                <div class="period-wrapper">
                    <div class="glass-period-box">PERIOD NO : ${last5}</div>
                </div>
            </div>
            <div class="buttons-area">
                <button class="btn btn-action" onclick="actionClick()">⚡ NEXT PREDICTION</button>
            </div>
        `;
    }
}

function centerEl(el){
    var w = el.offsetWidth||72, h = el.offsetHeight||72;
    el.style.transform='none';
    el.style.left = ((window.innerWidth - w)/2)+'px';
    el.style.top  = ((window.innerHeight - h)/2)+'px';
}

window.onload = function() {
    var wrap = document.getElementById('main-wrapper');
    var mini = document.getElementById('mini');
    wrap.style.display = 'flex';
    requestAnimationFrame(function(){
        centerEl(wrap); wrap.style.display='none';
        mini.style.display='flex';
        centerEl(mini);
        initDrag();
        render();
    });
};

window.openM = openM;
window.closeM = closeM;
window.actionClick = actionClick;
window.render = render;
</script>
</body>
