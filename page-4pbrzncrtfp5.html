    }
    #loader {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0c12;
        z-index: 9999;

        opacity: 0;
        pointer-events: none;
    }
    .spinner {
        width: 45px;
        height: 45px;
        border: 3px solid rgba(139, 92, 246, 0.1);
        border-top: 3px solid #8b5cf6;
        border-radius: 50%;

        margin-bottom: 20px;

    .loader-text { color: #94a3b8; font-size: 0.95rem; }

        margin-top: 16px;
        background: rgba(139, 92, 246, 0.1);
        padding: 4px 16px;
        border-radius: 60px;
        font-size: 0.7rem;
        color: #8b5cf6;
        border: 1px solid rgba(139, 92, 246, 0.2);
    }
    #content { display: none; }
    #content.active { display: block; }
</style>
