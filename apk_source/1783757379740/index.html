<script>
    // Firebase configuration (kept for potential future use, but no authentication required)
    // The VIP key system has been completely bypassed - dashboard is freely accessible
    
    let totalWins = 0;
    let totalLosses = 0;
    let totalJackpots = 0;

    // Text-to-speech function for result announcements
    function aiSpeak(text) {
        if ('speechSynthesis' in window) {
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 1.0; 
            window.speechSynthesis.speak(utterance);
        }
    }

    let sessionData = [];
    let lastProcessed = "";
    let currentActive = null;

    // Timer and prediction engine initialization
    function startDiversityEngine() {
        // Update timer every second (countdown to next minute)
        setInterval(() => {
            const s = new Date().getSeconds();
            const remaining = 60 - s;
            const secondsStr = remaining.toString().padStart(2, '0');
            document.getElementById('timer').innerText = `00:${secondsStr}`;
        }, 1000);
        
        // Main prediction and result checking engine (runs every 1.5 seconds)
        setInterval(enginePro, 1500); 
    }

    // Core engine: fetches latest draw results, updates predictions and statistics
    async function enginePro() {
        try {
            const r = await fetch(`https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json?t=${Date.now()}`);
            const data = await r.json();
            const list = data.data.list;
            const latest = list[0];
            const issue = latest.issueNumber;

            // Process new result when issue changes (new draw available)
            if (lastProcessed !== "" && lastProcessed !== issue) {
                if (currentActive && currentActive.period === issue) {
                    const n = parseInt(latest.number);
                    const sz = n >= 5 ? "BIG" : "SMALL";
                    let status = "";
                    
                    // Check if actual number matches any of the two predicted numbers (JACKPOT)
                    if (n === currentActive.n1 || n === currentActive.n2) {
                        status = '<span class="tag-jackpot">𝐉𝐀𝐂𝐊𝐏𝐎𝐓🎰</span>';
                        totalJackpots++;
                        document.getElementById('tj-count').innerText = totalJackpots;
                        aiSpeak("Jackpot");
                    } 
                    // Check if size prediction (BIG/SMALL) was correct
                    else if (sz === currentActive.size) {
                        status = '<span class="tag-win">𝐖𝐈𝐍𝐍💯</span>';
                        totalWins++;
                        document.getElementById('tw-count').innerText = totalWins;
                        aiSpeak("Win");
                    } 
                    // Prediction failed
                    else {
                        status = '<span class="tag-loss">𝐋𝐎𝐒𝐒🚫</span>';
                        totalLosses++;
                        document.getElementById('tl-count').innerText = totalLosses;
                        aiSpeak("Loss");
                    }

                    // Add to session history (latest on top)
                    sessionData.unshift({ p: issue.slice(-4), num: n, s: sz, res: status });
                    updateTable();
                }
            }

            // Generate prediction for next period
            const nextP = (BigInt(issue) + 1n).toString();
            if (!currentActive || currentActive.period !== nextP) {
                const seed = parseInt(issue.slice(-3));
                const history = list.slice(0, 10).map(x => parseInt(x.number));
                let bigBias = history.filter(n => n >= 5).length;
                
                // Dynamic trend prediction logic based on seed parity and historical bias
                let trend = (seed % 2 === 0) ? (bigBias >= 5 ? "BIG" : "SMALL") : (history[0] >= 5 ? "SMALL" : "BIG");

                let n1, n2;
                // Generate two prediction numbers based on trend
                if(trend === "BIG") {
                    n1 = [5, 6, 7, 8, 9][(seed + history[0]) % 5];
                    n2 = [0, 1, 2, 3, 4][(seed * 3) % 5];
                } else {
                    n1 = [0, 1, 2, 3, 4][(seed + history[0]) % 5];
                    n2 = [5, 6, 7, 8, 9][(seed * 7) % 5];
                }

                currentActive = { period: nextP, size: trend, n1: n1, n2: n2 };
                document.getElementById('res').innerText = trend;
                document.getElementById('n1').innerText = n1;
                document.getElementById('n2').innerText = n2;
                document.getElementById('nextP').innerText = nextP.slice(-4);
            }
            lastProcessed = issue;
        } catch(e) {
            // Silently handle network errors to keep UI responsive
            console.warn("Engine fetch error:", e);
        }
    }

    // Update the session history table with latest results
    function updateTable() {
        let h = "";
        sessionData.forEach(i => {
            h += `<tr>
                    <td>${i.p}</td>
                    <td>${i.num}</td>
                    <td style="color:${i.s==='BIG'?'#f44':'#0f9'}">${i.s}</td>
                    <td>${i.res}</td>
                  </tr>`;
        });
        document.getElementById('session-h').innerHTML = h;
    }

    // Initialize dashboard immediately - no login verification required
    startDiversityEngine();
</script>
