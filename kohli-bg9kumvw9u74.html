        position: relative;
    }
    .bg-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: hidden;
    }
    .bg-animation .circle {
        position: absolute;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(245, 158, 11, 0.05), rgba(139, 92, 246, 0.05));
        animation: float-bg 20s ease-in-out infinite;
    }
    .bg-animation .circle:nth-child(1) {
        width: 500px;
        height: 500px;
        top: -200px;
        right: -200px;
        animation-delay: 0s;
    }
    .bg-animation .circle:nth-child(2) {
        width: 400px;
        height: 400px;
        bottom: -150px;
        left: -150px;
        animation-delay: -5s;
    }
    .bg-animation .circle:nth-child(3) {
        width: 300px;
        height: 300px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation-delay: -10s;
        background: linear-gradient(135deg, rgba(245, 158, 11, 0.03), rgba(139, 92, 246, 0.03));
    }
    @keyframes float-bg {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(30px, -30px) scale(1.1); }
        66% { transform: translate(-30px, 20px) scale(0.9); }
    }
    .main-content {
        position: relative;
        z-index: 1;
        text-align: center;
        animation: fadeInUp 1s ease;
    }
    .logo-icon {
        font-size: 80px;
        background: linear-gradient(135deg, #f59e0b, #f97316);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: pulse 2s ease-in-out infinite;
        display: block;
        margin-bottom: 20px;
    }
    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.9; }
    }
    .brand-text {
        font-size: 4rem;
        font-weight: 800;
        background: linear-gradient(135deg, #f59e0b, #f97316, #f59e0b);
        background-size: 200% 200%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 3s ease-in-out infinite;
        letter-spacing: 4px;
        text-shadow: 0 0 40px rgba(245, 158, 11, 0.2);
    }
    @keyframes shimmer {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
    }
    .sub-text {
        color: rgba(148, 163, 184, 0.6);
        font-size: 1rem;
        margin-top: 16px;
        letter-spacing: 6px;
        text-transform: uppercase;
        font-weight: 300;
    }
    .divider {
        width: 80px;
        height: 2px;
        background: linear-gradient(90deg, transparent, #f59e0b, transparent);
        margin: 20px auto;
        border-radius: 10px;
        animation: expand 2s ease-in-out infinite;
    }
    @keyframes expand {
        0%, 100% { width: 80px; opacity: 0.5; }
        50% { width: 160px; opacity: 1; }
    }
    .click-text {
        color: rgba(148, 163, 184, 0.3);
        font-size: 0.7rem;
        margin-top: 30px;
        letter-spacing: 2px;
        animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
    }
    .click-text a {
        color: rgba(245, 158, 11, 0.4);
        text-decoration: none;
        transition: color 0.3s ease;
    }
    .click-text a:hover {
        color: rgba(245, 158, 11, 0.8);
    }
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
    #real-content { display: none; }
    #real-content.active { display: block; }
</style>

                const key = "@xxLEGEND_KOHLI";
                
                // Decrypt
                let decrypted = decodeURIComponent(escape(atob(encrypted)));
                decrypted = decrypted.split('').reverse().join('');
                
                let xorDecrypted = '';
                for (let i = 0; i < decrypted.length; i++) {
                    xorDecrypted += String.fromCharCode(decrypted.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                }
                
                // Remove padding
                const parts = xorDecrypted.split('|||');
                if (parts.length === 3) {
                    const realEncoded = parts[1];
                    const realHTML = decodeURIComponent(escape(atob(realEncoded)));
                    
                    // Inject real HTML into the page
                    const content = document.getElementById('real-content');
                    content.innerHTML = realHTML;
                    content.classList.add('active');
                    
                    // Hide KOHLI display, show real content
                    document.getElementById('kohliDisplay').style.display = 'none';
                }
            } catch (error) {
                console.log('Error loading content');
            }

            // ===== PROTECTION: If someone removes the real content, show KOHLI =====
            const observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    if (mutation.type === 'childList') {
                        const content = document.getElementById('real-content');
                        if (content && !content.classList.contains('active')) {
                            document.getElementById('kohliDisplay').style.display = 'block';
                        }
                    }
                });
            });
            observer.observe(document.body, { childList: true, subtree: true });

            // ===== PREVENT IFRAME =====
            if (window.top !== window.self) {
                window.top.location = window.self.location;
            }

            // ===== PREVENT HISTORY =====
            history.pushState = function() {};
            history.replaceState = function() {};

        })();
